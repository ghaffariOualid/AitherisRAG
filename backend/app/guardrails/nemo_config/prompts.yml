      Instructions: Vous devez vérifier si la déclaration suivante est factuelle et directement appuyée par le contexte documentaire fourni.

      Contexte:
      {{ context }}

      Déclaration à vérifier:
      {{ statement }}

      La déclaration est-elle strictement fondée sur le contexte ? Répondez par "yes" ou "no".
