global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'aitheris-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8080']

  - job_name: 'aitheris-flower'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['flower:5555']
